abstract_en: "A one-dimensional steady two-phase pressure-drop model was established to improve prediction of bubble-pump lifting performance in a single-pressure absorption refrigeration system. Homogeneous models, separated-flow frictional pressure-drop models and void-fraction correlations were compared by using water as the working fluid and experimental lifting-rate data as validation references. The results show that a suitable combination of a separated-flow friction model and a void-fraction model can describe the resistance variation in the riser more accurately, and the calculated values agree well with experimental data in the medium heating-power range. The deviation increases at higher heating power because bubble coalescence and flow-pattern transition become more significant. These results indicate that model selection should consider the coupling between frictional resistance and void fraction, providing a basis for riser design and operating-parameter optimization."
keywords_en: ["single-pressure absorption refrigeration", "pump", "two-phase flow", "model", "optimization"]
