abstract_zh: "针对单压吸收式制冷系统中气泡泵提升性能预测精度不足的问题，建立了一维稳态两相流压降数学模型，并将均相流模型、分相流摩阻压降模型和截面含气率模型进行组合比较。以饱和水为工质，结合提升管几何参数、加热功率和实验提升量数据，对不同模型的计算结果进行误差分析和适用性评价。结果表明，分相流框架下的摩阻压降模型与截面含气率模型合理组合后，能够更准确描述提升管内气液两相流动阻力变化，理论值与实验值在中等加热功率范围内吻合较好；当加热功率继续升高时，模型偏差随气泡聚并和流型转变而增大。该结果说明，气泡泵压降模型的选择应同时考虑摩阻项和含气率项的耦合影响，可为小型吸收式制冷装置的提升管尺寸设计和运行参数优化提供参考。"
keywords_zh: ["单压吸收式制冷", "泵", "两相流", "模型", "优化"]
